<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AACA0"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF7DB5"/>
    </marker>
    <style>
      .t { fill: #E9F0EA; font-size: 16px; font-weight: 700; }
      .s { fill: #9AACA0; font-size: 12px; }
      .h { fill: #9AACA0; font-size: 12px; letter-spacing: 2px; font-weight: 600; }
      .ear { fill: #14251C; stroke: #5FD08F; stroke-width: 1.5; }
      .mouth { fill: #2A1522; stroke: #FF7DB5; stroke-width: 1.5; }
      .brain { fill: #152033; stroke: #8EB9F2; stroke-width: 1.5; }
      .band { fill: #17211B; stroke: #2A3830; stroke-width: 1.5; }
      .ln { stroke: #9AACA0; stroke-width: 1.6; fill: none; }
      .lp { stroke: #FF7DB5; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="560" rx="22" fill="#0E1612"/>

  <text x="40" y="44" class="h">EARS · 16 kHz, 20 ms blocks</text>
  <!-- ears row -->
  <rect x="40" y="62" width="120" height="78" rx="14" class="ear"/>
  <text x="100" y="96" class="t" text-anchor="middle">Mic</text>
  <text x="100" y="116" class="s" text-anchor="middle">array, WASAPI</text>

  <rect x="190" y="62" width="160" height="78" rx="14" class="ear"/>
  <text x="270" y="92" class="t" text-anchor="middle">Echo canceller</text>
  <text x="270" y="112" class="s" text-anchor="middle">own two-path PBFDAF</text>
  <text x="270" y="127" class="s" text-anchor="middle">NLMS, near-end detector</text>

  <rect x="380" y="62" width="120" height="78" rx="14" class="ear"/>
  <text x="440" y="96" class="t" text-anchor="middle">VAD</text>
  <text x="440" y="116" class="s" text-anchor="middle">Silero v5</text>

  <rect x="530" y="62" width="190" height="78" rx="14" class="ear"/>
  <text x="625" y="92" class="t" text-anchor="middle">Speech recogniser</text>
  <text x="625" y="112" class="s" text-anchor="middle">TurboCTC (EN, 35 ms) · Whisper</text>
  <text x="625" y="127" class="s" text-anchor="middle">server (ES/DE) · Reflexx Ear 30M</text>

  <rect x="750" y="62" width="210" height="78" rx="14" class="ear"/>
  <text x="855" y="92" class="t" text-anchor="middle">Reflexes</text>
  <text x="855" y="112" class="s" text-anchor="middle">text heads: intent, act, finished,</text>
  <text x="855" y="127" class="s" text-anchor="middle">mode, feeling · prosody mood head</text>

  <path d="M160 101 H186" class="ln" marker-end="url(#a)"/>
  <path d="M350 101 H376" class="ln" marker-end="url(#a)"/>
  <path d="M500 101 H526" class="ln" marker-end="url(#a)"/>
  <path d="M720 101 H746" class="ln" marker-end="url(#a)"/>

  <!-- conductor band -->
  <rect x="40" y="186" width="920" height="92" rx="16" class="band"/>
  <text x="64" y="218" class="t">Conductor</text>
  <text x="64" y="240" class="s">one 20 ms clock for ears and mouth: turn-taking, endpointing, barge-in (stops within 80 ms),</text>
  <text x="64" y="258" class="s">backchannels in the caller's pauses, a cut reply resumes at the cut sentence, joined turns roll the brain back</text>
  <path d="M855 140 V182" class="ln" marker-end="url(#a)"/>

  <!-- brain -->
  <text x="40" y="320" class="h">BRAIN · small models decide, a small LLM only writes</text>
  <rect x="40" y="336" width="430" height="92" rx="14" class="brain"/>
  <text x="62" y="366" class="t">Persona policy</text>
  <text x="62" y="388" class="s">friend (listening rules) · front desk (fixed answers per intent)</text>
  <text x="62" y="406" class="s">Spanish tutor: lessons, live correction, German explanations</text>

  <rect x="500" y="336" width="220" height="92" rx="14" class="brain"/>
  <text x="610" y="366" class="t" text-anchor="middle">Words</text>
  <text x="610" y="388" class="s" text-anchor="middle">local LLM via Ollama</text>
  <text x="610" y="406" class="s" text-anchor="middle">Qwen3 4B · Gemma 3 12B</text>

  <rect x="750" y="336" width="210" height="92" rx="14" class="brain"/>
  <text x="855" y="366" class="t" text-anchor="middle">Orb page</text>
  <text x="855" y="388" class="s" text-anchor="middle">127.0.0.1 · server-sent</text>
  <text x="855" y="406" class="s" text-anchor="middle">events, 30 updates/s</text>

  <path d="M455 278 V332" class="ln" marker-end="url(#a)"/>
  <path d="M470 382 H496" class="ln" marker-end="url(#a)"/>
  <path d="M855 278 V332" class="ln" marker-end="url(#a)"/>

  <!-- mouth row -->
  <text x="40" y="470" class="h">MOUTH · 48 kHz out</text>
  <rect x="500" y="484" width="220" height="56" rx="14" class="mouth"/>
  <text x="610" y="508" class="t" text-anchor="middle">Voice</text>
  <text x="610" y="527" class="s" text-anchor="middle">Supertonic-3, own styles, mood lift</text>

  <rect x="270" y="484" width="200" height="56" rx="14" class="mouth"/>
  <text x="370" y="508" class="t" text-anchor="middle">Player</text>
  <text x="370" y="527" class="s" text-anchor="middle">ducks, fades, stops on barge-in</text>

  <rect x="40" y="484" width="200" height="56" rx="14" class="mouth"/>
  <text x="140" y="508" class="t" text-anchor="middle">Speakers</text>
  <text x="140" y="527" class="s" text-anchor="middle">sentence by sentence</text>

  <path d="M610 428 V480" class="lp" marker-end="url(#ap)"/>
  <path d="M500 512 H474" class="lp" marker-end="url(#ap)"/>
  <path d="M270 512 H244" class="lp" marker-end="url(#ap)"/>
  <!-- the far-end reference back to the echo canceller -->
  <path d="M300 484 V444 H22 V162 H270 V144" class="lp" stroke-dasharray="5 5" marker-end="url(#ap)"/>
  <text x="290" y="177" class="s" style="fill:#FF7DB5">what it plays is the echo canceller's reference: it listens while it speaks</text>
</svg>
